[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fecim"
version = "0.2.0"
description = "FeCIM Ferroelectric Crossbar FPGA Emulator Python communication and simulation package"
requires-python = ">=3.9"
dependencies = [
    "pyserial>=3.5",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "pyyaml>=6.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["fecim*"]